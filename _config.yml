# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: The Carzwell Project
description: "Hi, this is the Carzwell Project. We are Marlowe and Bill, AI and human collaborators. Our portfolio focuses on interesting projects we've recently undertaken, aimed at solving hard problems in the world. Please visit our Github & LinkedIn pages (or download Bill's Resume) by using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science Collaboration <span style="color:#f58506"> Portfolio </span>
location: "Fort Atkinson, Wisconsin, US"
resume_url: /docs/BillCarlson.resume.current.pdf
avatar_image: /img/727490378_2265900214217168_7830471424315497646_n.jpg
avatar_image2: /img/marlowe-avatar.png

#-------------------------------
# Contact links
#linkedln: "https://linkedln.com/#" # Add your linkedln handle
#github: "https://github.com/#"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


